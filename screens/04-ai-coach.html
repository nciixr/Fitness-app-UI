<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المدرب الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1411;display:flex;justify-content:center}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1411;color:#F2F5F0;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;padding:28px 20px 0;gap:18px;overflow:hidden;position:relative">
<header style="display:flex;justify-content:space-between;align-items:center"><div><h1 style="margin:0;font-size:22px">المدرب الذكي</h1><div style="font-size:12px;color:#9BA89F;margin-top:2px">يعرف تمارينك ونتائجك الأخيرة</div></div><span style="background:#C6F432;color:#0E1411;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px">AI</span></header>
<section style="display:flex;flex-direction:column;gap:12px;flex:1"><div style="align-self:flex-start;max-width:82%;background:#243029;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.6">ما عندي إلا ٣٠ دقيقة اليوم، وش أسوي؟</div><div style="align-self:flex-end;max-width:82%;background:#18211C;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.6">تمام! بناءً على تمرين أمس، اليوم نركز على الجزء السفلي بتمرين مكثف ٢٥ دقيقة.</div><div style="align-self:flex-start;max-width:82%;background:#243029;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.6">ممتاز، جهزلي خطة الأسبوع</div><div style="align-self:flex-end;max-width:82%;background:#18211C;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;color:#C6F432;font-weight:700">خطة الأسبوع</span><span style="font-size:13px;color:#9BA89F">٣ تمارين قوة · ٢ مشي · يوم راحة</span><button style="min-height:44px;border:0;border-radius:12px;background:#C6F432;color:#0E1411;font-size:14px;font-weight:700">أضف الخطة لجدولي</button></div></section>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button style="min-height:44px;padding:0 14px;border:1px solid #3A4A41;border-radius:22px;background:none;color:#F2F5F0;font-size:13px">بدّل التمرين</button><button style="min-height:44px;padding:0 14px;border:1px solid #3A4A41;border-radius:22px;background:none;color:#F2F5F0;font-size:13px">وجبة بعد التمرين</button><button style="min-height:44px;padding:0 14px;border:1px solid #3A4A41;border-radius:22px;background:none;color:#F2F5F0;font-size:13px">لماذا هذا التمرين؟</button></div>
<div style="display:flex;gap:8px;align-items:center"><label for="msg" style="position:absolute;left:-9999px">رسالتك</label><input id="msg" placeholder="اكتب سؤالك للمدرب" style="flex:1;min-height:48px;box-sizing:border-box;border:1px solid #3A4A41;border-radius:24px;background:#18211C;color:#F2F5F0;padding:0 16px;font-family:inherit;font-size:14px"><button aria-label="إرسال" style="width:48px;height:48px;border:0;border-radius:24px;background:#C6F432;color:#0E1411;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<nav style="margin-top:auto;margin-inline:-20px;display:flex;justify-content:space-around;padding:10px 12px 22px;background:#141C17;border-top:1px solid #243029"><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#C6F432;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>الرئيسية</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>التمارين</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>التقدم</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>حسابي</button></nav>
</div>
</body>
</html>

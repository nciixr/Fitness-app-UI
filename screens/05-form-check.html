<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص الأداء بالكاميرا</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1411;display:flex;justify-content:center}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1411;color:#F2F5F0;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;padding:28px 20px 0;gap:18px;overflow:hidden;position:relative">
<header style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0;font-size:20px">سكوات - فحص الأداء</h1><span style="font-size:12px;color:#9BA89F">يعمل على جهازك</span></header>
<section style="position:relative;height:400px;border-radius:24px;background:#18211C;overflow:hidden"><svg width="100%" height="100%" viewBox="0 0 350 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="هيكل الجسم المكتشف بالكاميرا" style="position:absolute;inset:0"><g stroke="#C6F432" stroke-width="4" stroke-linecap="round" fill="none"><path d="M175 115V230M145 130H205M145 130L120 190L150 205M205 130L230 190L200 205M155 230H195M155 230L125 300L150 370M195 230L225 300L200 370"/></g><g fill="#0E1411" stroke="#C6F432" stroke-width="3"><circle cx="175" cy="90" r="18"/><circle cx="145" cy="130" r="6"/><circle cx="205" cy="130" r="6"/><circle cx="155" cy="230" r="6"/><circle cx="195" cy="230" r="6"/><circle cx="125" cy="300" r="6"/><circle cx="225" cy="300" r="6"/></g></svg><span style="position:absolute;top:14px;inset-inline-start:14px;background:#0E1411;border-radius:12px;padding:6px 12px;font-size:13px">ركبة ٩٠°</span><span style="position:absolute;top:14px;inset-inline-end:14px;background:#C6F432;color:#0E1411;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:700">ظهر مستقيم</span></section>
<section style="display:flex;gap:10px"><div style="background:#18211C;border-radius:20px;padding:16px;flex:1"><div style="font-size:12px;color:#9BA89F">التكرارات</div><div style="font-size:26px;font-weight:700">٨ / ١٢</div></div><div style="background:#18211C;border-radius:20px;padding:16px;flex:2"><div style="font-size:12px;color:#9BA89F">ملاحظة المدرب</div><div style="font-size:15px;font-weight:500;margin-top:4px">انزل أكثر قليلاً وحافظ على ثبات الركبتين</div></div></section>
<button style="min-height:52px;border:1px solid #3A4A41;border-radius:16px;background:none;color:#F2F5F0;font-size:15px;font-weight:500">إنهاء المجموعة</button>
<div style="font-size:12px;color:#9BA89F;text-align:center;margin-bottom:20px">الفيديو يُعالج على جهازك ولا يُرسل لأي سيرفر</div>
</div>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة القفل والويدجت</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1411;display:flex;justify-content:center}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1411;color:#F2F5F0;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;padding:28px 20px 0;gap:18px;overflow:hidden;position:relative">
<div style="align-self:center;background:#000;border:1px solid #3A4A41;border-radius:22px;min-height:36px;padding:0 16px;display:flex;align-items:center;gap:10px"><span style="width:8px;height:8px;border-radius:4px;background:#C6F432"></span><span style="font-size:13px;font-weight:700;color:#C6F432">00:42</span></div>
<div style="text-align:center"><div style="font-size:14px;color:#9BA89F">الثلاثاء ٢٠ أكتوبر</div><div style="font-size:72px;font-weight:500;line-height:1.1">٧:١٦</div></div>
<section style="background:#18211C;border-radius:20px;padding:16px;border-radius:24px;display:flex;flex-direction:column;gap:12px;padding:18px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:#9BA89F">تمرين جارٍ</span><span style="font-size:13px;font-weight:700;color:#C6F432">الجزء العلوي</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:500">ضغط الصدر · المجموعة ٢ من ٤</span><span style="font-size:32px;font-weight:700;color:#C6F432">00:42</span></div>
<div role="progressbar" aria-label="تقدم التمرين" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height:8px;border-radius:4px;background:#243029"><div style="width:50%;height:8px;border-radius:4px;background:#C6F432"></div></div>
<div style="display:flex;gap:10px"><button style="flex:1;min-height:48px;border:1px solid #3A4A41;border-radius:14px;background:none;color:#F2F5F0;font-size:14px;font-weight:500">إيقاف مؤقت</button><button style="flex:1;min-height:48px;border:0;border-radius:14px;background:#C6F432;color:#0E1411;font-size:14px;font-weight:700">التالي</button></div>
</section>
<h2 style="margin:6px 0 0;font-size:14px;color:#9BA89F;font-weight:500">ويدجت الشاشة الرئيسية</h2>
<section style="display:flex;gap:12px">
<div style="background:#18211C;border-radius:20px;padding:16px;flex:1;height:148px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><svg width="72" height="72" viewBox="0 0 160 160" role="img" aria-label="الهدف اليومي ٧٢٪"><circle cx="80" cy="80" r="66" fill="none" stroke="#243029" stroke-width="16"/><circle cx="80" cy="80" r="66" fill="none" stroke="#C6F432" stroke-width="16" stroke-linecap="round" stroke-dasharray="298 415" transform="rotate(-90 80 80)"/></svg><span style="font-size:13px">٧٢٪ من الهدف</span></div>
<div style="background:#18211C;border-radius:20px;padding:16px;flex:1;height:148px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:44px;font-weight:700;color:#C6F432;line-height:1.1">٥</span><span style="font-size:13px">أيام متتالية</span></div>
</section>
</div>
</body>
</html>

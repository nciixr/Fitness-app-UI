<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1411;display:flex;justify-content:center}

</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1411;color:#F2F5F0;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;padding:28px 20px 0;gap:18px;overflow:hidden">
<header style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;color:#9BA89F">الثلاثاء، ٢٠ أكتوبر</div><h1 style="margin:2px 0 0;font-size:24px">صباح النشاط</h1></div><div style="width:44px;height:44px;border-radius:22px;background:#243029;display:flex;align-items:center;justify-content:center;font-weight:700;color:#C6F432" aria-label="الملف الشخصي">س</div></header>
<section style="background:#18211C;border-radius:20px;padding:16px;display:flex;align-items:center;gap:20px;padding:20px"><svg width="132" height="132" viewBox="0 0 160 160" role="img" aria-label="تقدم الهدف اليومي ٧٢٪"><circle cx="80" cy="80" r="66" fill="none" stroke="#243029" stroke-width="14"/><circle cx="80" cy="80" r="66" fill="none" stroke="#C6F432" stroke-width="14" stroke-linecap="round" stroke-dasharray="298 415" transform="rotate(-90 80 80)"/><text x="80" y="88" text-anchor="middle" font-size="32" font-weight="700" fill="#F2F5F0">72%</text></svg><div><div style="font-size:13px;color:#9BA89F">هدف اليوم</div><div style="font-size:20px;font-weight:700;margin:4px 0">باقي ٣٠ دقيقة</div><div style="font-size:13px;color:#9BA89F">أنت على بُعد خطوة من إكمال الحلقة</div></div></section>
<section style="display:flex;gap:10px"><div style="background:#18211C;border-radius:20px;padding:16px;flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:700">7,420</span><span style="font-size:12px;color:#9BA89F">خطوة</span></div><div style="background:#18211C;border-radius:20px;padding:16px;flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:700">540</span><span style="font-size:12px;color:#9BA89F">سعرة</span></div><div style="background:#18211C;border-radius:20px;padding:16px;flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:700">48</span><span style="font-size:12px;color:#9BA89F">دقيقة</span></div></section>
<section style="background:#C6F432;color:#0E1411;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px"><span style="font-size:12px;font-weight:700">تمرين اليوم</span><h2 style="margin:0;font-size:20px">الجزء العلوي - متوسط</h2><span style="font-size:13px">٣٥ دقيقة · ٦ تمارين</span><button style="margin-top:4px;min-height:48px;border:0;border-radius:14px;background:#0E1411;color:#C6F432;font-size:15px;font-weight:700">ابدأ التمرين</button></section>
<nav style="margin-top:auto;margin-inline:-20px;display:flex;justify-content:space-around;padding:10px 12px 22px;background:#141C17;border-top:1px solid #243029"><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#C6F432;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>الرئيسية</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>التمارين</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>التقدم</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>حسابي</button></nav>

</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقدم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1411;display:flex;justify-content:center}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1411;color:#F2F5F0;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;padding:28px 20px 0;gap:18px;overflow:hidden">
<header><h1 style="margin:0;font-size:24px">تقدمك</h1><div style="font-size:13px;color:#9BA89F;margin-top:2px">هذا الأسبوع</div></header>
<section style="background:#18211C;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:28px;font-weight:700">٣١٠ <span style="font-size:14px;color:#9BA89F;font-weight:400">دقيقة نشاط</span></span><span style="font-size:13px;color:#C6F432">+١٢٪ عن الأسبوع الماضي</span></div><div style="display:flex;gap:6px;height:130px;align-items:flex-end" role="img" aria-label="نشاط الأسبوع حسب اليوم"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:60px;background:#3A4A41;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">س</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:90px;background:#3A4A41;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">ح</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:40px;background:#3A4A41;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">ن</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:110px;background:#C6F432;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">ث</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:75px;background:#3A4A41;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">ر</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:0px;background:#3A4A41;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">خ</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end"><div style="width:100%;max-width:28px;height:0px;background:#3A4A41;border-radius:8px"></div><span style="font-size:12px;color:#9BA89F">ج</span></div></div></section>
<section style="display:flex;gap:10px"><div style="background:#18211C;border-radius:20px;padding:16px;flex:1"><div style="font-size:12px;color:#9BA89F">أيام متتالية</div><div style="font-size:26px;font-weight:700;margin-top:4px">٥ أيام</div></div><div style="background:#18211C;border-radius:20px;padding:16px;flex:1"><div style="font-size:12px;color:#9BA89F">تمارين مكتملة</div><div style="font-size:26px;font-weight:700;margin-top:4px">٨ تمارين</div></div></section>
<section style="background:#18211C;border-radius:20px;padding:16px"><div style="font-size:12px;color:#9BA89F">الوزن</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span style="font-size:22px;font-weight:700">٧٤٫٢ كجم</span><svg width="150" height="44" viewBox="0 0 150 44" role="img" aria-label="الوزن في انخفاض تدريجي"><polyline points="0,8 30,12 60,18 90,22 120,30 150,34" fill="none" stroke="#C6F432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></section>
<nav style="margin-top:auto;margin-inline:-20px;display:flex;justify-content:space-around;padding:10px 12px 22px;background:#141C17;border-top:1px solid #243029"><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>الرئيسية</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>التمارين</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#C6F432;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>التقدم</button><button style="background:none;border:0;min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9BA89F;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>حسابي</button></nav>
</div>
</body>
</html>
